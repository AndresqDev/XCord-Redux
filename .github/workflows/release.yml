name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Checksum
        run: sha256sum build/Xcord.jar > build/Xcord.jar.sha256

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/Xcord.jar
            build/Xcord.jar.sha256
          generate_release_notes: true
