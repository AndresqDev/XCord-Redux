name: Build

on:
  push:
    branches:
      - unpolished-production-code
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Checksum
        run: sha256sum build/Xcord.jar > build/Xcord.jar.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Xcord
          path: |
            build/Xcord.jar
            build/Xcord.jar.sha256
          if-no-files-found: error
